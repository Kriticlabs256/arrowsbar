<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Reservations – ARROWS</title>
    <link rel="stylesheet" href="ARROWS STYLEZ.css">
</head>
<body>

    <nav class="navbar">
        <ul class="menu">
            <li><a href="MY PROJECT.html">HOME</a></li>
            <li><a href="menu.html">MENU</a></li>
            <li><a href="#">ABOUT</a></li>
            <li><a href="#">CONTACT</a></li>
        </ul>
    </nav>

    <section class="reservation-section">
        <div class="reservation-box">
            <h2>Book a Table</h2>
            <p>We can't wait to serve you. Fill in your details below to reserve your spot!</p>
            <form class="reservation-form">
                <input type="text" placeholder="Full Name" required>
                <input type="email" placeholder="Email Address" required>
                <input type="tel" placeholder="Phone Number" required>
                <input type="date" required>
                <input type="time" required>
                <select required>
                    <option value="">Select Party Size</option>
                    <option value="1">10 People</option>
                    <option value="2">20 People</option>
                    <option value="3">30 People</option>
                    <option value="4+">40 or more</option>
                </select>
                <select>
                    <option value="">Select Party Type</option>
                    <option value="BD">Birthday Party</option>
                    <option value="MEET">Meeting</option>
                    <option value="Dance">Dance Party</option>
                    <OPTION VALUE="">OTHER</OPTION>
                </select>
                <textarea placeholder="Special Requests (optional)"></textarea>
                <button type="submit">Reserve Now</button>
            </form>
        </div>
    </section>

</body>
</html>
